    function getBWver() {
            var Sys = {};
            var ua = navigator.userAgent.toLowerCase();
            var s;
//            alert(ua);
            (s = ua.match(/rv:([\d.]+)\) like gecko/)) ? Sys.ie = s[1] :
            (s = ua.match(/edge\/([\d.]+)/)) ? Sys.ie = s[1] :
            (s = ua.match(/msie ([\d.]+)/)) ? Sys.ie = s[1] :
            (s = ua.match(/firefox\/([\d.]+)/)) ? Sys.firefox = s[1] :
            (s = ua.match(/opr\/([\d.]+)/)) ? Sys.opera = s[1] :
            (s = ua.match(/chrome\/([\d.]+)/)) ? Sys.chrome = s[1] :
 //           (s = ua.match(/opera.([\d.]+)/)) ? Sys.opera = s[1] :
            (s = ua.match(/version\/([\d.]+).*safari/)) ? Sys.safari = s[1] : 0;
            
            if (Sys.ie)      return 'MSIE:'    +  Sys.ie;     //document.write('IE: ' + Sys.ie);
            if (Sys.firefox) return 'Firefox:' +  Sys.firefox;//document.write('Firefox: ' + Sys.firefox);
            if (Sys.chrome)  return 'Chrome:'  +  Sys.chrome; //document.write('Chrome: ' + Sys.chrome);
            if (Sys.opera)   return 'Opera:'   +  Sys.opera;  //document.write('Opera: ' + Sys.opera);
            if (Sys.safari)  return 'Safari:'  +  Sys.safari; //document.write('Safari: ' + Sys.safari);
    }
    function getOSver() {
            var Sys = {};
            var ua = navigator.userAgent.toLowerCase();
            var s;
            (s = ua.match(/windows nt ([\d.]+);/)) ? Sys.win = s[1] :
            (s = ua.match(/mac\)/)) ? Sys.mac = s[1] :
            (s = ua.match(/linux\)/)) ? Sys.linux = s[1] : 0;
            if (Sys.win) {
			    var bit=" 32 bits";
				var found;
                (found = ua.match(/wow64/)) ? bit = " 64 bits" :
                (found = ua.match(/win64/)) ? bit = " 64 bits" :
                (found = ua.match(/x64/)) ? bit = " 64 bits" : 0;
                //var parser=Sys.win.split(';');
			    //parser[0]
                switch(Sys.win){
                    case "3.1":
                    case "3.5":
                    case "3.51":
                    case "4.0":			return 'Windows NT'+bit;
                    case "5.0":			return 'Windows 2000'+bit;
                    case "5.1":
                    case "5.2":			return 'Windows XP'+bit;
                    case "6.0":         return 'Windows Vista'+bit;
                    case "6.1":         return 'Windows 7'+bit;
                    case "6.2":         return 'Windows 8'+bit;
                    case "6.3":         return 'Windows 8.1'+bit;
                    case "10.0":        return 'Windows 10'+bit;
                    default: return 'Windows';
                }
			}
            if (Sys.linux) {
			    var bit=" 32 bits";
				var found;
				var other="";
                (found = ua.match(/x86_64/)) ? bit = " 64 bits" :
                (found = ua.match(/x64/)) ? bit = " 64 bits" : 0;
				
                (found = ua.match(/ubuntu/)) ? other = " Ubuntu" : 0;
				
				return "Linux"+bit+other;
            }
				
			//    return 'Windows:'    +  Sys.win+","+s[1];     //document.write('IE: ' + Sys.ie);
			
	        return "";//"s:"+s[0]+","+s[1];
    }
